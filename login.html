<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WriteBlog</title>
    <meta name="description" content="Sign in to WriteBlog - Share your stories and connect with creators">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=16.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="db-adapter.js"></script>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-spinner">
            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
        </div>
        <p class="loading-text">Loading WriteBlog...</p>
    </div>

    <!-- Authentication Section -->
    <div id="authSection" class="auth-section">
        <div class="floating-shapes">
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
        </div>
        
        <div class="auth-container">
            <div class="auth-logo">
                <div class="logo-icon">
                    <i class="fas fa-blog"></i>
                </div>
                <h1>WriteBlog</h1>
                <p class="tagline">Where Stories Come to Life</p>
            </div>
            
            <!-- Login Form -->
            <div id="loginForm" class="auth-form">
                <h2>Welcome Back</h2>
                <p class="auth-subtitle">Continue your creative journey</p>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="loginEmail"><i class="fas fa-envelope"></i> Email Address</label>
                        <div class="form-input">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="loginEmail" placeholder="you@example.com" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword"><i class="fas fa-lock"></i> Password</label>
                        <div class="form-input">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="loginPassword" placeholder="Enter your password" required>
                        </div>
                    </div>
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <span>Sign In</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </form>
                <div class="divider">
                    <span>or</span>
                </div>
                <div class="social-auth">
                    <button class="btn-social" onclick="handleSocialLogin('google')">
                        <i class="fab fa-google"></i>
                        <span>Continue with Google</span>
                    </button>
                    <button class="btn-social" onclick="handleSocialLogin('github')">
                        <i class="fab fa-github"></i>
                        <span>Continue with GitHub</span>
                    </button>
                </div>
                <p class="auth-switch">Don't have an account? <a href="register.html">Create Account</a></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Wait for script.js to load, then initialize
        window.addEventListener('DOMContentLoaded', function() {
            // Initialize Supabase first
            try {
                if (typeof initSupabase === 'function') {
                    initSupabase();
                }
            } catch (e) {
                console.warn('Supabase init warning:', e);
            }
            
            // Initialize data
            try {
                if (typeof initializeData === 'function') {
                    initializeData();
                }
            } catch (e) {
                console.warn('Data init warning:', e);
            }
            
            // Check if already logged in
            if (typeof currentUser !== 'undefined' && currentUser) {
                window.location.href = 'feed.html';
            } else {
                // Hide loading screen
                document.getElementById('loadingScreen').style.display = 'none';
            }
        });
    </script>
</body>
</html>
