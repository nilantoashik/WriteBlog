<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - WriteBlog</title>
    <meta name="description" content="Join WriteBlog - Share your stories and connect with creators">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=16.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="db-adapter.js"></script>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-spinner">
            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
        </div>
        <p class="loading-text">Loading WriteBlog...</p>
    </div>

    <!-- Authentication Section -->
    <div id="authSection" class="auth-section">
        <div class="floating-shapes">
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
        </div>
        
        <div class="auth-container">
            <div class="auth-logo">
                <div class="logo-icon">
                    <i class="fas fa-blog"></i>
                </div>
                <h1>WriteBlog</h1>
                <p class="tagline">Where Stories Come to Life</p>
            </div>
            
            <!-- Register Form -->
            <div id="registerForm" class="auth-form">
                <h2>Create Account</h2>
                <p class="auth-subtitle">Join our community of creators</p>
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="regName"><i class="fas fa-user"></i> Full Name</label>
                        <div class="form-input">
                            <i class="fas fa-user"></i>
                            <input type="text" id="regName" placeholder="John Doe" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="regUsername"><i class="fas fa-at"></i> Username</label>
                        <div class="form-input">
                            <i class="fas fa-at"></i>
                            <input type="text" id="regUsername" placeholder="yourname" minlength="3" pattern="[A-Za-z0-9._]+">
                        </div>
                        <small class="form-hint">Only letters, numbers, dots, and underscores. Must be unique.</small>
                    </div>
                    <div class="form-group">
                        <label for="regEmail"><i class="fas fa-envelope"></i> Email Address</label>
                        <div class="form-input">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="regEmail" placeholder="you@example.com" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="regPassword"><i class="fas fa-lock"></i> Password</label>
                        <div class="form-input">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="regPassword" placeholder="At least 6 characters" required minlength="6">
                        </div>
                        <div class="password-strength">
                            <div class="password-strength-bar"></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="regBio"><i class="fas fa-pen"></i> Bio (Optional)</label>
                        <div class="form-input">
                            <i class="fas fa-pen"></i>
                            <textarea id="regBio" rows="3" placeholder="Tell us about yourself..." style="border:none;outline:none;background:transparent;color:var(--text-primary);font-size:1rem;font-family:inherit;font-weight:500;resize:none;"></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <span>Create Account</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </form>
                <p class="auth-switch">Already have an account? <a href="login.html">Sign In</a></p>
            </div>
        </div>
    </div>

    <script src="script.js?v=17"></script>
    <script>
        window.addEventListener('DOMContentLoaded', function() {
            // Initialize Supabase first
            try {
                if (typeof initSupabase === 'function') initSupabase();
            } catch (e) {}
            
            // Initialize data
            try {
                if (typeof initializeData === 'function') initializeData();
            } catch (e) {}
            
            // Check if already logged in
            if (typeof currentUser !== 'undefined' && currentUser) {
                window.location.href = 'feed.html';
            } else {
                // Hide loading screen
                document.getElementById('loadingScreen').style.display = 'none';
            }
            
            // Password strength indicator
            const passwordInput = document.getElementById('regPassword');
            if (passwordInput) {
                passwordInput.addEventListener('input', (e) => {
                    const password = e.target.value;
                    const strengthBar = document.querySelector('.password-strength-bar');
                    if (strengthBar) {
                        const strength = calculatePasswordStrength(password);
                        strengthBar.style.width = `${strength}%`;
                    }
                });
            }
        });
    </script>
</body>
</html>
